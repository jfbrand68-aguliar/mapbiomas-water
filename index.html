<style>
:root{

*{box-sizing:border-box}
html,body{height:100%}
body{

  font-family:'Archivo',system-ui,-apple-system,sans-serif;

  padding:22px 28px 16px;
}
.eyebrow{

  letter-spacing:.16em; text-transform:uppercase; color:var(--tenue);
  margin-bottom:6px;
}
h1{margin:0; font-size:23px; font-weight:600; letter-spacing:-.01em}
h1 .clase{color:var(--agua)}

.control{display:flex; align-items:center; gap:8px}
.control label{
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--tenue);
  margin-right:2px;
}
#region{
  appearance:none; -webkit-appearance:none;

  padding:8px 34px 8px 12px; min-width:120px; cursor:pointer;
}
.paso-nav{
  background:var(--panel); border:1px solid var(--borde); border-radius:5px;
  color:var(--tenue); cursor:pointer; width:34px; height:36px;
  font-size:15px; line-height:1; display:grid; place-items:center;
  transition:color .15s, border-color .15s;
}
.paso-nav:hover:not(:disabled){color:var(--tinta); border-color:var(--tenue)}
.paso-nav:disabled{opacity:.35; cursor:default}
#region:focus-visible,.paso-nav:focus-visible,.tab:focus-visible{
  outline:2px solid var(--agua); outline-offset:2px;
}

/* ---------- pestanas de paso ---------- */
.tabs{
  display:flex; gap:2px; overflow-x:auto; padding:0 28px;
  border-bottom:1px solid var(--borde); scrollbar-width:thin;
}
.tab{
  flex:0 0 auto; background:none; border:0; cursor:pointer;
  color:var(--tenue); font-family:'IBM Plex Mono',monospace;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  padding:11px 15px 12px; border-bottom:2px solid transparent;
  margin-bottom:-1px; white-space:nowrap;
  transition:color .15s, border-color .15s;
}
.tab:hover:not(:disabled):not(.activa){color:var(--tinta)}
.tab.activa{color:var(--agua); border-bottom-color:var(--agua)}
.tab:disabled{opacity:.3; cursor:default}

/* ---------- cuerpo ---------- */
main{flex:1; display:flex; flex-direction:column; padding:0 28px 8px; min-height:0}
.resumen{
  display:flex; flex-wrap:wrap; gap:26px; padding:16px 2px 14px;

}
.resumen b{color:var(--tinta); font-weight:500}
.chip{

}
.chip.visible{display:inline-block}
.lienzo{flex:1; min-height:340px; position:relative}
#grafica{position:absolute; inset:0}
#vacio{

#vacio.visible{display:grid}

footer{

footer .sello{font-family:'IBM Plex Mono',monospace; font-size:11px}

@media (max-width:720px){

<script>
(function(){
  var D = window.DATOS, M = D.meta;
  var MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var $ = function(id){ return document.getElementById(id); };

  // --- eje temporal ---------------------------------------------------
  var etiquetas = [], calendario = [], porEtiqueta = {};
  for (var i = 0; i < M.n_meses; i++){
    var t = (M.mes_ini - 1) + i;
    var y = M.anio_ini + Math.floor(t / 12), m = (t % 12) + 1;
    var et = MESES[m-1] + ' ' + y;
    etiquetas.push(et);
    calendario.push({y:y, m:m});
    porEtiqueta[et] = {y:y, m:m};       // la etiqueta es unica en toda la serie
  }

  function num(v){
    var d = v >= 1000 ? 0 : (v >= 10 ? 1 : 2);
    return v.toLocaleString('es-CO', {minimumFractionDigits:d, maximumFractionDigits:d});
  }

  // --- estado ---------------------------------------------------------
  var iRegion = 0, idPaso = M.pasos.length ? M.pasos[0].id : null;
  var serieActual = null;                    // serie que se esta mostrando
  var vi0 = 0, vi1 = M.n_meses - 1;          // ventana visible, en indices

  // Densidad de etiquetas del eje X segun cuantos meses quepan a la vista.
  // Sin esto, al acercar el zoom el eje se queda sin ninguna etiqueta.
  function calcNivel(n){
    if (n > 300) return 0;   // ano cada 5
    if (n > 144) return 1;   // ano cada 2
    if (n > 48)  return 2;   // cada ano
    if (n > 15)  return 3;   // cada trimestre
    return 4;                // cada mes
  }
  var nivel = calcNivel(M.n_meses);

  // OJO: en un eje de categorias ECharts pasa el indice del tick VISIBLE, no el
  // indice del dato. Con zoom, el primer tick llega como 0 y etiquetaria 1985.
  // Por eso se resuelve la fecha desde el valor de la categoria.
  function fmtEje(valor){
    var a = porEtiqueta[valor];
    if (!a) return '';
    var corto = MESES[a.m-1] + ' ' + String(a.y).slice(2);
    if (nivel === 0) return (a.m === 1 && a.y % 5 === 0) ? String(a.y) : '';
    if (nivel === 1) return (a.m === 1 && a.y % 2 === 0) ? String(a.y) : '';
    if (nivel === 2) return (a.m === 1) ? String(a.y) : '';
    if (nivel === 3) return (a.m % 3 === 1) ? corto : '';
    return corto;
  }

  // Lee del propio grafico que tramo esta visible tras mover el slider.
  function leerVentana(){
    var opc = chart.getOption() || {};
    var dz = (opc.dataZoom || [])[0];
    var n = M.n_meses;
    if (!dz){ vi0 = 0; vi1 = n - 1; return; }
    if (dz.startValue != null && dz.endValue != null){
      vi0 = Math.round(dz.startValue);
      vi1 = Math.round(dz.endValue);
    } else {
      vi0 = Math.floor((dz.start || 0) / 100 * (n - 1));
      vi1 = Math.ceil((dz.end == null ? 100 : dz.end) / 100 * (n - 1));
    }
    if (vi1 < vi0){ var t = vi0; vi0 = vi1; vi1 = t; }
    vi0 = Math.max(0, Math.min(n - 1, vi0));
    vi1 = Math.max(0, Math.min(n - 1, vi1));
  }

  // Todo el resumen se calcula sobre la ventana visible, no sobre la serie
  // completa: de otro modo el maximo podria caer fuera de lo que se ve.
  function actualizarResumen(){
    var vista = $('r-vista');
    if (!serieActual){
      ['r-rango','r-meses','r-max','r-ceros'].forEach(function(id){
        $(id).textContent = '—';
      });
      vista.classList.remove('visible');
      return;
    }
    var v = serieActual.v, max = 0, imax = -1, ceros = 0, n = 0;
    for (var i = vi0; i <= vi1; i++){
      n++;
      if (v[i] > max){ max = v[i]; imax = i; }
      if (v[i] === 0) ceros++;
    }
    var completo = (vi0 === 0 && vi1 === M.n_meses - 1);
    $('r-rango').textContent = etiquetas[vi0] + ' – ' + etiquetas[vi1];
    $('r-meses').textContent = completo ? String(n) : n + ' de ' + M.n_meses;
    $('r-max').textContent = (imax >= 0 && max > 0)
      ? num(max) + ' ' + M.unidad + ' · ' + etiquetas[imax] : '—';
    $('r-ceros').textContent = n
      ? ceros + ' (' + Math.round(ceros / n * 100) + '%)' : '—';
    vista.classList.toggle('visible', !completo);
  }

  // --- selector de region ---------------------------------------------
  var sel = $('region');
  M.regiones.forEach(function(r){
    var o = document.createElement('option');
    o.value = r; o.textContent = r; sel.appendChild(o);

    $('tabs').appendChild(b);

    xAxis:{

      axisLine:{lineStyle:{color:'#22303C'}}, axisTick:{show:false},
      axisLabel:{
        color:'#8496A3', fontSize:11, interval:0, hideOverlap:true,
        formatter:function(v){ return fmtEje(v); }
      },
      splitLine:{show:false}
    },
    yAxis:{
      type:'value', name:M.unidad, nameGap:14,
      nameTextStyle:{color:'#8496A3', fontSize:11, align:'left'},
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:'#8496A3', fontSize:11,
        formatter:function(v){ return v >= 1000 ? (v/1000)+'k' : v; }},
      splitLine:{lineStyle:{color:'#1B2732'}}
    },
    dataZoom:[
      {type:'inside', throttle:40},
      {type:'slider', height:22, bottom:16, borderColor:'transparent',

       handleStyle:{color:'#4FC9D4', borderColor:'#4FC9D4'},
       moveHandleStyle:{color:'#22303C'},
       dataBackground:{lineStyle:{color:'#2C3E4B'}, areaStyle:{color:'#1A262F'}},
       selectedDataBackground:{lineStyle:{color:'#4FC9D4'}, areaStyle:{color:'#1E4A55'}},
       textStyle:{color:'#8496A3', fontSize:10}}
    ]
  };

  function dibujar(serie, nombrePaso){
    var v = serie.v, esc = serie.a;
    serieActual = serie;

    chart.setOption(Object.assign({}, base, {
      tooltip: Object.assign({}, base.tooltip, {
        formatter:function(p){
          var i = p[0].dataIndex;
          var e = (esc && esc[i]) ? 'sí' : 'no';
          return '<b style="color:#E7EEF3">' + etiquetas[i] + '</b><br>' +
                 M.clase + ' · ' + num(v[i]) + ' ' + M.unidad +
                 '<br><span style="color:#8496A3">' + nombrePaso + '</span>' +
                 '<br><span style="color:#8496A3">escena disponible · ' + e + '</span>';
        }
      }),
      series:[{
        name:M.clase, type:'line', data:v,
        showSymbol:false, symbolSize:5, sampling:'lttb',
        lineStyle:{color:'#4FC9D4', width:1.3},
        itemStyle:{color:'#4FC9D4'},
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
          {offset:0, color:'rgba(79,201,212,.26)'},
          {offset:1, color:'rgba(79,201,212,0)'}
        ])},
        emphasis:{focus:'series', itemStyle:{borderColor:'#0E151B', borderWidth:2}}
      }]
    }), {notMerge:false});

    // el zoom se conserva al cambiar de region o paso, asi que se relee
    leerVentana();
    actualizarResumen();
  }

  // Al mover el slider: rango, estadisticas y densidad del eje se recalculan.
  // El eje solo se vuelve a pintar cuando cambia el nivel, no en cada pixel.
  chart.on('dataZoom', function(){
    leerVentana();
    actualizarResumen();
    var nuevo = calcNivel(vi1 - vi0 + 1);
    if (nuevo !== nivel){
      nivel = nuevo;
      chart.setOption({xAxis:{axisLabel:{
        formatter:function(v){ return fmtEje(v); }
      }}});
    }
  });

  // --- render principal -------------------------------------------------
  function pintar(){
    var region = M.regiones[iRegion];
    var disponibles = D.reg[region] || {};

    // pestanas: se apagan los pasos que esta region no tiene
    M.pasos.forEach(function(p){
      var b = tabs[p.id];
      var hay = Object.prototype.hasOwnProperty.call(disponibles, p.id);
      b.disabled = !hay;
      b.title = hay ? p.id : p.id + ' · sin datos para ' + region;
      b.setAttribute('aria-selected', String(p.id === idPaso && hay));
      b.classList.toggle('activa', p.id === idPaso && hay);
    });

    // si el paso activo no existe aqui, caer al primero disponible
    if (!disponibles[idPaso]){
      var alt = M.pasos.filter(function(p){ return disponibles[p.id]; })[0];
      if (alt){ idPaso = alt.id; return pintar(); }
    }

    sel.selectedIndex = iRegion;
    $('prev').disabled = (iRegion === 0);
    $('next').disabled = (iRegion === M.regiones.length - 1);

    var serie = disponibles[idPaso];
    var vacio = $('vacio');
    if (!serie){
      vacio.textContent = 'No hay archivos para ' + region + ' en ningún paso.';
      vacio.classList.add('visible');
      chart.clear();
      serieActual = null;
      actualizarResumen();
      return;
    }
    vacio.classList.remove('visible');
    var et = (M.pasos.filter(function(p){ return p.id === idPaso; })[0] || {}).et || idPaso;
    dibujar(serie, et);
  }

  function irRegion(i){
    iRegion = Math.max(0, Math.min(M.regiones.length - 1, i));
    pintar();
  }
  sel.addEventListener('change', function(){ irRegion(sel.selectedIndex); });
  $('prev').addEventListener('click', function(){ irRegion(iRegion - 1); });
  $('next').addEventListener('click', function(){ irRegion(iRegion + 1); });
  window.addEventListener('resize', function(){ chart.resize(); });

  pintar();
})();
</script>
</body>
</html>
